<!DOCTYPE html>
<html>
<head>
    <title>StayMatch Chat</title>
    <style>
        body {
            font-family: Arial;
            background: #0f0f1a;
            color: white;
        }

        .chat-container {
            width: 400px;
            margin: auto;
            margin-top: 50px;
            background: #1a1a2e;
            padding: 20px;
            border-radius: 15px;
        }

        #chatBox {
            height: 300px;
            overflow-y: scroll;
            margin-bottom: 10px;
        }

        .msg {
            padding: 10px;
            margin: 5px;
            border-radius: 10px;
            max-width: 70%;
        }

        .me {
            background: #5c54e5;
            text-align: right;
            margin-left: auto;
        }

        .other {
            background: #333;
        }

        input {
            width: 70%;
            padding: 10px;
        }

        button {
            padding: 10px;
            background: #5c54e5;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

<div class="chat-container">

    <h3 id="chatTitle">Chat</h3>

    <div id="chatBox"></div>

    <input type="text" id="msg" placeholder="Type message...">
    <button onclick="sendMsg()">Send</button>

</div>

<script src="chat.js"></script>

</body>
</html>
